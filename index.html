<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentHub</title><link rel="stylesheet" href="style.css"></head><body><header><b>RentHub</b><nav><a href="#listings">Listings</a><a href="#how">How It Works</a><button onclick="showForm()">List Item</button></nav></header><section class="hero"><h1>Rent what you need.</h1><p>Find vehicles, electronics, furniture and tools from local owners.</p><div class="search"><input id="q" placeholder="Search rentals..." oninput="render()"><select id="cat" onchange="render()"><option>All</option><option>Vehicles</option><option>Electronics</option><option>Furniture</option><option>Tools</option></select></div></section><main id="listings"><h2>Available Rentals</h2><div id="grid"></div></main><section id="how"><h2>How It Works</h2><div class="steps"><article>1️⃣ <b>Search</b><p>Find an item.</p></article><article>2️⃣ <b>Choose</b><p>Check price and location.</p></article><article>3️⃣ <b>Rent</b><p>Send a rental request.</p></article></div></section><footer>© 2026 RentHub</footer><div id="modal" class="modal"><div class="box"><button onclick="hideForm()">×</button><h2>List an Item</h2><form onsubmit="addItem(event)"><input id="name" required placeholder="Item name"><select id="newcat" required><option value="">Category</option><option>Vehicles</option><option>Electronics</option><option>Furniture</option><option>Tools</option></select><input id="price" type="number" required placeholder="₹ per day"><input id="location" required placeholder="Location"><button>Publish Listing</button></form></div></div><script src="script.js"></script></body></html>
